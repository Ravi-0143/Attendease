services:
  - type: web
    name: attendease
    runtime: node
    region: oregon

    # Build: install server deps, then build the React client
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build

    # Start: run the Express server from the server directory
    startCommand: cd server && node index.js

    healthCheckPath: /api/students

    envVars:
      - key: NODE_ENV
        value: production

      - key: GEMINI_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: REDIRECT_URI
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: CLOUDINARY_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: JWT_SECRET
        sync: false
